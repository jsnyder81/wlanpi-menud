[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wlanpi-menud"
version = "0.1.0"
description = "WLAN Pi menu service: menu manifests, sessions, jobs and the surface protocol"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "BSD-3-Clause" }
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: System Administrators",
]
dependencies = [
    "jsonschema>=4.18",
    "websockets>=14",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
wlanpi-menud = "wlanpi_menud.__main__:main"

[tool.setuptools.packages.find]
include = ["wlanpi_menud*"]

[tool.pytest.ini_options]
testpaths = ["protocol/tests", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
